[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "entdec"
version = "0.1.0"
description = "Entertainment_decision - hybrid KG + NLP + LLM recommender for movies and games"
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
dynamic = ["dependencies"]

[project.optional-dependencies]
auth = [
    "SQLAlchemy>=2.0,<3.0",
    "PyMySQL>=1.1",
    "argon2-cffi>=23.1",
    "pyotp>=2.9",
    "cryptography>=42.0",
    "qrcode[pil]>=7.4",
    "email-validator>=2.1",
]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"entdec.ui" = ["workspace.js", "workspace.css"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: requires real Docker MySQL/Neo4j and/or a running Ollama server",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
